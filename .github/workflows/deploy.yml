name: Desplegar

# Se ejecuta a mano: Actions → Desplegar → Run workflow.
# Aplica las migraciones, despliega el Worker en Cloudflare y sube como secretos del Worker los que estén definidos en
# Settings → Secrets and variables → Actions. Ver docs/firebase-push.md.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apuntar a la base de datos D1 de esta congregación
        run: sed -i "s/00000000-0000-0000-0000-000000000000/${{ secrets.D1_DATABASE_ID }}/" wrangler.json

      - name: Migraciones
        run: npx wrangler d1 migrations apply DB --remote

      - name: Desplegar
        run: npm run deploy

      - name: Secretos del Worker (solo los definidos)
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY_JWK: ${{ secrets.VAPID_PRIVATE_KEY_JWK }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          PUSH_RELAY_URL: ${{ secrets.PUSH_RELAY_URL }}
          PUSH_RELAY_KEY: ${{ secrets.PUSH_RELAY_KEY }}
        run: |
          node -e '
            const names = ["JWT_SECRET","VAPID_PUBLIC_KEY","VAPID_PRIVATE_KEY_JWK","VAPID_SUBJECT","FCM_SERVICE_ACCOUNT","PUSH_RELAY_URL","PUSH_RELAY_KEY"];
            const out = {};
            for (const n of names) if (process.env[n]) out[n] = process.env[n];
            require("fs").writeFileSync("secrets.json", JSON.stringify(out));
            console.log("Secretos a subir:", Object.keys(out).join(", ") || "(ninguno)");
          '
          npx wrangler secret bulk secrets.json
          rm -f secrets.json
